name: Google Alerts to Markdown

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  fetch-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install feedparser python-dateutil openai

      - name: Fetch RSS and create markdown
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: |
          python << 'EOF'
          import os, sys, json
          import feedparser
          from datetime import date
          from openai import OpenAI

          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

          FEEDS = {
              "plf": "https://www.google.com/alerts/feeds/12677963391557493013/16911975429276077784",
              "g7":  "https://www.google.com/alerts/feeds/12677963391557493013/18044456110239789222",
              "apd": "https://www.google.com/alerts/feeds/12677963391557493013/16911975429276077976"
          }

          RULES = {
              "g7": {
                  "must": "sommet du G7, diplomatie, chefs d'État, communiqué final, gouvernance internationale, géopolitique, APD, climat, sécurité",
                  "exclude": "jeux vidéo, gaming, manette, controller, PS5, Xbox, hardware, test produit, e-sport"
              },
              "plf": {
                  "must": "PLF, loi de finances, budget, amendements, Assemblée nationale, Sénat, 49.3, finances publiques",
                  "exclude": "promotions, shopping"
              },
              "apd": {
                  "must": "aide publique au développement, APD/ODA, coopération, bailleurs, financement du développement",
                  "exclude": "contenus non pertinents"
              }
          }

          def classify(topic, title):
              prompt = f"""
          Tu fais de la veille affaires publiques.
          Thème: {topic.upper()}
          Garde uniquement si c'est à propos de: {RULES[topic]['must']}
          Exclure si c'est à propos de: {RULES[topic]['exclude']}

          Titre: {title}

          Réponds STRICTEMENT en JSON:
          {{"keep": true/false, "reason": "phrase courte"}}
          """
              resp = client.responses.create(
                  model="gpt-4.1-mini",
                  input=prompt
              )
              try:
                  return json.loads(resp.output_text)
              except Exception:
                  return {"keep": False, "reason": "Erreur parsing IA"}

          today = date.today().isoformat()

          for topic, url in FEEDS.items():
              feed = feedparser.parse(url)
              entries = getattr(feed, "entries", [])

              kept, dropped = [], []

              for e in entries[:20]:
                  title = getattr(e, "title", "")
                  link = getattr(e, "link", "")
                  result = classify(topic, title)
                  item = {"title": title, "link": link, "reason": result["reason"]}
                  (kept if result["keep"] else dropped).append(item)

              os.makedirs(topic, exist_ok=True)
              path = f"{topic}/{today}.md"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(f"# Veille {topic.upper()} – {today}\n\n")
                  f.write("## 🧠 Résumé du jour (IA)\n")
                  f.write(f"- {len(kept)} article(s) pertinent(s) identifié(s).\n\n")

                  f.write("## 📰 Articles retenus\n")
                  for it in kept:
                      f.write(f"- **{it['title']}**\n  {it['link']}\n  _Pourquoi: {it['reason']}_\n\n")

                  f.write("## 🚫 Articles écartés\n")
                  for it in dropped:
                      f.write(f"- {it['title']}\n  _Raison: {it['reason']}_\n\n")

              print(f"[OK] {path} écrit (kept={len(kept)}, dropped={len(dropped)})")

          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily policy monitoring with AI" || echo "Nothing to commit"
          git push
